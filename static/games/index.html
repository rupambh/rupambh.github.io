<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Games</title>
  <style>
    :root {
      --bg-canvas: #F4EFEA;
      --bg-card: #FAF7F2;
      --text-main: #292524;
      --text-muted: #57534E;
      --accent-primary: #1E3A8A;
      --accent-tag: #9A3412;
      --border-subtle: rgba(41, 37, 36, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-canvas: #18181B;
        --bg-card: #27272A;
        --text-main: #E2DDD5;
        --text-muted: #9C958A;
        --accent-primary: #93C5FD;
        --accent-tag: #FB923C;
        --border-subtle: rgba(226, 221, 213, 0.12);
      }
    }

    [data-theme="light"] {
      --bg-canvas: #F4EFEA;
      --bg-card: #FAF7F2;
      --text-main: #292524;
      --text-muted: #57534E;
      --accent-primary: #1E3A8A;
      --accent-tag: #9A3412;
      --border-subtle: rgba(41, 37, 36, 0.12);
    }

    [data-theme="dark"] {
      --bg-canvas: #18181B;
      --bg-card: #27272A;
      --text-main: #E2DDD5;
      --text-muted: #9C958A;
      --accent-primary: #93C5FD;
      --accent-tag: #FB923C;
      --border-subtle: rgba(226, 221, 213, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      line-height: 1.6;
      padding: 56px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 780px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
      margin-bottom: 32px;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .theme-btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--accent-primary);
      border-radius: 8px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .badge {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent-tag);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card h2 {
      margin: 0 0 20px;
      font-size: 1.2rem;
      color: var(--accent-primary);
    }

    .controls-meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .launch-arrow {
      font-weight: 700;
      color: var(--accent-primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Games</h1>
      <button class="theme-btn" id="themeToggle" type="button">Light / Dark</button>
    </header>

    <main class="grid">
      <a class="card" href="./pinball/">
        <div>
          <span class="badge">Windows 98 Edition</span>
          <h2>3D Pinball – Space Cadet</h2>
        </div>
        <div class="controls-meta">
          <span>Keyboard &amp; Touch</span>
          <span class="launch-arrow">Play &#8594;</span>
        </div>
      </a>

      <a class="card" href="./fruit-ninja/">
        <div>
          <span class="badge">Dojo Edition</span>
          <h2>Fruit Ninja</h2>
        </div>
        <div class="controls-meta">
          <span>Touch &amp; Mouse</span>
          <span class="launch-arrow">Play &#8594;</span>
        </div>
      </a>
    </main>
  </div>

  <script>
    const root = document.documentElement;
    document.getElementById("themeToggle").addEventListener("click", function () {
      const current = root.getAttribute("data-theme");
      if (current === "dark") {
        root.setAttribute("data-theme", "light");
      } else if (current === "light") {
        root.setAttribute("data-theme", "dark");
      } else {
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        root.setAttribute("data-theme", prefersDark ? "light" : "dark");
      }
    });
  </script>
</body>
</html>
